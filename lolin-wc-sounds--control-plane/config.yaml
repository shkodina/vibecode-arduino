# Пул адресов, которые сканируются по порту 80 в поисках lolin-wc-sounds.
# Подсеть взята с текущего LAN (192.168.88.0/24). Поправьте под свою сеть.

listen:
  host: 127.0.0.1
  port: 8000

scan:
  subnet: 192.168.88.0/24
  port: 80
  timeout_seconds: 0.45
  concurrency: 80
  hosts: []

# Найденные модули. Обновляется после «Сканировать сеть».
modules:
  - host: 192.168.88.28
    port: 80
