# shel-cmd-conv: yq -o json config.yaml > config.json
# На карту кладётся config.json. Этот yaml - черновик для людей.
# timezone_offset: 3 значит UTC+3 (Москва). Строку Europe/Moscow ESP не понимает.
server:
  port: 80
ntp:
  server: "pool.ntp.org"
  timezone_offset: 3
  update_interval: 3600
wifi:
  ssid: your_ssid
  password: your_password
motion:
  # сколько секунд играть после последнего ПРИНЯТОГО движения
  timeout_seconds: 30
  # пауза перед новым стартом play
  cooldown_seconds: 5
  # импульс PIR раньше этого = повтор Delay модуля, не человек. 0 = выкл.
  # в ванной с длинной крутилкой Delay поставь 45–60
  repeat_seconds: 15
  # спокойный HIGH, мс: отсечь дребезг пина (наводка ESP)
  stable_ms: 400
  # после ребута столько секунд PIR игнорируется
  boot_ignore_seconds: 10
logging:
  level: INFO
playback:
  type: files
  schedule:
  - start: "00:00"
    end: "06:00"
    directory: "/birds_sounds"
    volume: 60
    random_on_startup: true
    format: wav
    shuffle: false
    repeat_selected: true
    loop_directory: false
  - start: "06:00"
    end: "12:00"
    directory: "/birds_sounds"
    volume: 100
    random_on_startup: true
    format: wav
    shuffle: false
    repeat_selected: true
    loop_directory: false
  - start: "12:00"
    end: "18:00"
    directory: "/birds_sounds"
    volume: 100
    random_on_startup: true
    format: wav
    shuffle: false
    repeat_selected: true
    loop_directory: false
  - start: "18:00"
    end: "24:00"
    directory: "/birds_sounds"
    volume: 100
    random_on_startup: true
    format: wav
    shuffle: false
    repeat_selected: true
    loop_directory: false
